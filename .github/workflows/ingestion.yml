name: GLOBALPULSE scheduled ingestion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingestion.yml"
      - "supabase/functions/globalpulse-ingest/**"
      - "supabase/migrations/005_verified_provider_sources.sql"
      - "supabase/migrations/006_expanded_official_sources.sql"
  schedule:
    # Six-hour cadence keeps private-repository Actions usage within the free allowance.
    # Provider registry expanded on 2026-11-17; run once against the new allowlist.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: globalpulse-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request a short-lived GitHub Actions identity token
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=globalpulse-ingest")"
          oidc_token="$(echo "$token_response" | jq -r '.value')"
          test -n "$oidc_token" && test "$oidc_token" != "null"
          echo "::add-mask::$oidc_token"
          echo "token=$oidc_token" >> "$GITHUB_OUTPUT"

      - name: Trigger authenticated ingestion
        env:
          OIDC_TOKEN: ${{ steps.identity.outputs.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://trilekpqafbaznadjbsm.supabase.co/functions/v1/globalpulse-ingest"
